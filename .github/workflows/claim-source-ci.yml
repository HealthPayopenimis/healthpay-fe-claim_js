name: Claim source CI

on:
  push:
    branches:
      - "**"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps
      - name: Run claim component tests
        run: npm test
      - name: Build package
        run: npm run build
